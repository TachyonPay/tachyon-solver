# Production-leaning compose for relayer + solver.
#
# Local: copy env.example to .env, fill in keys, then `docker compose up -d`.
#
# AWS / remote: same file. Drop the .env on the host (or render it from SSM /
# Secrets Manager into a tmpfs mount), point the host's docker-engine at it,
# `docker compose up -d`. Volumes survive `compose up/down`; nuke them only
# with `docker compose down -v`.
#
# Order: relayer must be healthy before solver starts (solver registers
# routes/balance/ECIES key with the relayer at boot). The relayer persists
# registrations to its Pebble store, so a relayer restart with the volume
# intact transparently rehydrates them.

services:
  relayer:
    build:
      context: .
      dockerfile: Dockerfile.relayer
    image: tachyon/relayer:local
    container_name: tachyon-relayer
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      # Override DB_PATH so it lands inside the mounted volume; the binary
      # appends "/relayer" itself.
      DB_PATH: /data
    expose:
      - "3000"
    volumes:
      - relayer-data:/data
    networks:
      - tachyon-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  solver:
    build:
      context: .
      dockerfile: Dockerfile.solver
    image: tachyon/solver:local
    container_name: tachyon-solver
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      DB_PATH: /data
      # Inside the compose network the relayer is reachable by service name,
      # not localhost — the .env's RELAYER_URL=http://localhost:3000 is fine
      # for direct host runs but must be overridden here.
      RELAYER_URL: http://relayer:3000
    expose:
      - "3001"
    volumes:
      - solver-data:/data
    networks:
      - tachyon-network
    depends_on:
      relayer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  privacy-router:
    build:
      context: .
      dockerfile: Dockerfile.privacy-router
    image: tachyon/privacy-router:local
    container_name: tachyon-privacy-router
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      DB_PATH: /data
      # Reach the relayer via service name on the compose network rather
      # than the .env localhost default.
      RELAYER_URL: http://relayer:3000
    expose:
      - "3003"
    volumes:
      - privacy-router-data:/data
    networks:
      - tachyon-network
    depends_on:
      relayer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: tachyon-caddy
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - tachyon-network
    depends_on:
      relayer:
        condition: service_healthy
      solver:
        condition: service_healthy
      privacy-router:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  relayer-data:
    driver: local
  solver-data:
    driver: local
  privacy-router-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  tachyon-network:
    driver: bridge

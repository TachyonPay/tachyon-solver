[toolchain]
anchor_version = "0.32.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
bridge_intent = "64SZByfhWxvxu7haf153RHBvReNUFqz154RNagBbeYwk"

[programs.devnet]
bridge_intent = "64SZByfhWxvxu7haf153RHBvReNUFqz154RNagBbeYwk"

[programs.mainnet]
bridge_intent = "64SZByfhWxvxu7haf153RHBvReNUFqz154RNagBbeYwk"

[registry]

[package]
name = "bridge_intent"
version = "0.1.0"
description = "Cross-chain bridging intent program — Solana side of the Tachyon BridgeIntent protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bridge_intent"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.0", features = ["init-if-needed"] }
anchor-spl = "0.32.0"
